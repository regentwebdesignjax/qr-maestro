# fly-redirect-origin/fly.toml
# Run: fly launch --name qr-sensei-redirect --region iad --no-deploy
# Then: fly deploy

app = "qr-sensei-redirect"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
